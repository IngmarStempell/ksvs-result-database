<div class="page-head">
  <div>
    <h1>Vereinsaliase</h1>
    <p class="muted">Schreibweisen, die auf kanonische Vereine zeigen.</p>
  </div>
</div>
<form class="form-grid" method="post" action="/club-aliases">
  <label>Alias
    <input name="alias" required>
  </label>
  <label>Kanonischer Verein
    <input name="club" list="known-clubs" required>
  </label>
  <label>Kreis
    <input name="association_code" placeholder="OD">
  </label>
  <label>Quelle
    <input name="source" placeholder="manual">
  </label>
  <div class="actions span-2">
    <button type="submit">Alias speichern</button>
  </div>
</form>
<datalist id="known-clubs">
  {{club_options}}
</datalist>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Alias</th>
        <th>Kanonischer Verein</th>
        <th>Kreis</th>
        <th>Quelle</th>
        <th>Status</th>
        <th>Aktion</th>
      </tr>
    </thead>
    <tbody>
      {{rows}}
    </tbody>
  </table>
</div>
