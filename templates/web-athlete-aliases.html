<div class="page-head"><div><h1>Sportleraliase</h1><p class="muted">Alternative Schreibweisen zur stabilen Sportler-ID.</p></div></div>
<form class="form-grid" method="post" action="/athlete-aliases">
  <label>Sportler-ID <input name="athlete_id" type="number" required></label>
  <label>Alias <input name="alias" required></label>
  <div class="actions"><button type="submit">Alias speichern</button></div>
</form>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Alias</th><th>Sportler-ID</th><th>Sportler</th><th>Status</th><th>Aktion</th></tr></thead><tbody>{{rows}}</tbody></table></div>
