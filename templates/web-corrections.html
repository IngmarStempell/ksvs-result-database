<div class="page-head">
  <div>
    <h1>Korrekturen</h1>
    <p class="muted">{{active_count}} aktive Korrekturen, {{total_count}} Eintraege in der Historie.</p>
  </div>
  <div class="actions">
    <a href="/corrections/issues">Parserfaelle pruefen</a>
  </div>
</div>
<form class="form-grid" method="post" action="/corrections">
  <label>Art
    <select name="entity_type">
      <option value="club" {{club_selected}}>Verein</option>
      <option value="athlete" {{athlete_selected}}>Sportler</option>
    </select>
  </label>
  <label>Rohwert oder alter kanonischer Wert
    <input name="old_value" value="{{prefill_old_value}}" list="known-old-values" required>
  </label>
  <label class="span-2">Neuer kanonischer Wert
    <input name="new_value" list="known-new-values" required>
  </label>
  <label class="span-2">Notiz
    <input name="reason">
  </label>
  <div class="actions span-2">
    <button type="submit">Korrektur speichern</button>
  </div>
</form>
<datalist id="known-old-values">
  {{club_options}}
  {{athlete_options}}
</datalist>
<datalist id="known-new-values">
  {{club_options}}
  {{athlete_options}}
</datalist>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Art</th>
        <th>Feld</th>
        <th>Scope</th>
        <th>Von</th>
        <th>Nach</th>
        <th>Notiz</th>
        <th>Status</th>
        <th>Angelegt</th>
        <th>Aktualisiert</th>
        <th>Aktion</th>
      </tr>
    </thead>
    <tbody>
      {{rows}}
    </tbody>
  </table>
</div>
