<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} - PDF Explorer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --line: #d9dee7;
      --text: #17202a;
      --muted: #667085;
      --accent: #0f766e;
      --accent-soft: #dff7f3;
      --hover: #fff4c2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .brand {
      font-size: 18px;
      font-weight: 700;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      padding: 7px 10px;
      border-radius: 6px;
    }
    nav a:hover,
    nav a.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    main {
      width: min(1280px, calc(100vw - 32px));
      margin: 22px auto 44px;
    }
    .page-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
    }
    .muted,
    .empty {
      color: var(--muted);
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 880px;
    }
    th,
    td {
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      background: #f1f4f8;
    }
    tbody tr:hover {
      background: var(--hover);
    }
    .num {
      text-align: right;
      white-space: nowrap;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      margin-bottom: 18px;
    }
    .filter-bar {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr)) auto;
      gap: 12px;
      align-items: end;
      padding: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      margin-bottom: 18px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .meta {
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .meta strong {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
    }
    input,
    select,
    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      font: inherit;
      padding: 7px 9px;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 650;
    }
    form.inline {
      margin: 0;
    }
    form.inline button {
      min-height: 30px;
      padding: 4px 8px;
      background: #ffffff;
      color: var(--accent);
    }
    .span-2 {
      grid-column: span 2;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-top: 0;
      background: var(--panel);
    }
    .pager form,
    .pager div {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    a {
      color: var(--accent);
    }
    @media (max-width: 760px) {
      header,
      .page-head {
        align-items: stretch;
        flex-direction: column;
      }
      main {
        width: min(100vw - 20px, 1280px);
        margin-top: 14px;
      }
      table {
        min-width: 760px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .filter-bar,
      .meta-grid {
        grid-template-columns: 1fr;
      }
      .span-2 {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">PDF Explorer</div>
    <nav aria-label="Hauptnavigation">
      <a class="{{active_import_runs}}" href="/import-runs">Importlaeufe</a>
      <a class="{{active_results}}" href="/results">Ergebnisse</a>
      <a class="{{active_athletes}}" href="/athletes">Sportler</a>
      <a class="{{active_clubs}}" href="/clubs">Vereine</a>
      <a class="{{active_teams}}" href="/teams">Mannschaften</a>
      <a class="{{active_sources}}" href="/sources">Quellen</a>
      <a class="{{active_parser_runs}}" href="/parser-runs">Parserlaeufe</a>
      <a class="{{active_combined}}" href="/combined">LM/DM</a>
      <a class="{{active_club_aliases}}" href="/club-aliases">Aliase</a>
      <a class="{{active_corrections}}" href="/corrections">Korrekturen</a>
      <a class="{{active_honors}}" href="/honors">Ehrungen</a>
    </nav>
  </header>
  <main>
    {{content}}
  </main>
</body>
</html>
