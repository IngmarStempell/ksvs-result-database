[package]
name = "pdf-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
hex = "0.4.3"
pdf-extract = "0.12.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
url = "2.5.8"
